        <h4 id="电商问数mysql"><a href="#电商问数mysql" class="headerlink" title="电商问数mysql"></a>电商问数mysql</h4><h5 id="docker-compose-yaml"><a href="#docker-compose-yaml" class="headerlink" title="docker-compose.yaml"></a>docker-compose.yaml</h5><figure class="highlight yaml"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line"><span class="attr">services:</span> <span class="comment"># 必写,定义所有的应用容器应用</span></span><br><span class="line"><span class="attr">volumes:</span> <span class="comment"># 可选,管理命名卷(持久化数据)</span></span><br></pre></td></tr></table></figure>

<figure class="highlight yaml"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br></pre></td><td class="code"><pre><span class="line"><span class="attr">services:</span></span><br><span class="line">	<span class="attr">mysql:</span></span><br><span class="line">		<span class="attr">image:</span> <span class="string">mysql:8.0</span></span><br><span class="line">		<span class="attr">container_name:</span> <span class="string">mysql</span></span><br><span class="line">		<span class="attr">restart:</span> <span class="string">unless-stopped</span></span><br><span class="line">		<span class="attr">environment:</span></span><br><span class="line">			<span class="attr">MYSQL_ROOT_PASSWORD:</span> <span class="string">ljx</span></span><br><span class="line">			<span class="attr">MYSQL_USER:</span> <span class="string">ljx</span></span><br><span class="line">			<span class="attr">MYSQL_PASSWORD:</span> <span class="string">ljx</span></span><br><span class="line">		<span class="attr">volumes:</span></span><br><span class="line">			<span class="bullet">-</span> <span class="attr">mysql_data:</span> <span class="string">/var/lib/mysql</span></span><br><span class="line">			<span class="bullet">-</span> <span class="string">./mysql:/docker-entrypoint-initdb.d</span></span><br><span class="line">		<span class="attr">command:</span></span><br><span class="line">			<span class="bullet">-</span> <span class="string">--character-set-server=utf8mb4</span></span><br><span class="line">			<span class="bullet">-</span> <span class="string">--collation-server=utf8mb4_general_ci</span></span><br><span class="line"><span class="attr">volumes:</span></span><br><span class="line">	<span class="attr">mysql_data:</span></span><br><span class="line">         </span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line">restart: always容器不管什么原因,永远自动重启</span><br><span class="line">restart: unless-stopped容器意外崩溃，</span><br><span class="line">不写restart / restart: &quot;no&quot; :任何情况下都不自动重启,挂了就停在那</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">yaml会自动将关键词 true/false/yes/no/on/off默认解析为布尔值，而不是字符串。</span><br><span class="line">加双引号 &quot;no&quot; 是为规避 YAML 布尔解析坑，属于防御性写法</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br></pre></td><td class="code"><pre><span class="line">MYSQL_USER: username</span><br><span class="line">MYSQL_PASSWORD: password</span><br><span class="line">环境变量只能定义单个普通用户,只能在建表语句中创建其他用户</span><br><span class="line"></span><br><span class="line">CREATE USER  IF NOT EXISTS &#x27;jim&#x27;@&#x27;%&#x27; IDENTIFIED BY &#x27;jim&#x27;;创建一个用户jim，密码为jim的用户，允许从任何地址连接数据库</span><br><span class="line"></span><br><span class="line">GRANT ALL PRIVILEGES ON *.* TO &#x27;jim&#x27;@&#x27;%&#x27;;</span><br><span class="line"></span><br><span class="line">FLUSH PRIVILEGES;</span><br></pre></td></tr></table></figure>

<figure class="highlight yaml"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br></pre></td><td class="code"><pre><span class="line"><span class="attr">volumes:</span></span><br><span class="line">	<span class="comment"># 命名卷,持久化,命名卷挂载,将docker容器的数据挂载在宿主机系统管理的命名卷，不在容器内部。(/var/lib/docker/volumes/shopkeeper_mysql_data/_data)</span></span><br><span class="line">	<span class="bullet">-</span> <span class="attr">mysql_data:</span> <span class="string">./var/lib/mysql</span> </span><br><span class="line">	</span><br><span class="line">	<span class="comment"># 绑定挂载: 将初始化脚本绑定到宿主机的./mysql目录下</span></span><br><span class="line">	<span class="bullet">-</span> <span class="string">./mysql:</span> <span class="string">/docker-entrypoint-initdb.d</span></span><br></pre></td></tr></table></figure>

<figure class="highlight yaml"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><span class="line"><span class="attr">command:</span> <span class="comment"># 每一次启动MySQL容器会自动加载字符集配置</span></span><br><span class="line">	<span class="comment"># 设置服务器默认字符集为utf8是阉割版,最多存储3个字节字符,存不了emoji/生僻字/特殊字符</span></span><br><span class="line">	<span class="comment"># utf8mb4是完整的4字节UTF-8,支持所有的Unicode字符。</span></span><br><span class="line">	<span class="bullet">-</span> <span class="string">--character-set-server=utf8mb4</span></span><br><span class="line">	</span><br><span class="line">	<span class="comment"># 设置校对规则对大小写不敏感</span></span><br><span class="line">	<span class="bullet">-</span> <span class="string">--collation-server=utf8mb4_general_ci</span></span><br></pre></td></tr></table></figure>

<figure class="highlight yaml"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 顶层volumes</span></span><br><span class="line"><span class="comment"># 因为前面命名挂载了mysql_data,需要通过顶层volumes声明mysql_data是一个命名卷，需要自动创建。</span></span><br><span class="line"><span class="attr">volumes:</span></span><br><span class="line">	<span class="attr">mysql_data:</span>  <span class="comment"># 顶层的volumes对象是键值对象!!!没有-</span></span><br></pre></td></tr></table></figure>

<h5 id="sql语句"><a href="#sql语句" class="headerlink" title="sql语句"></a>sql语句</h5><figure class="highlight sql"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><span class="line"># 设置客户端与MySQL服务器之间数据传输的字符集与校对规则。</span><br><span class="line"># 等价于: </span><br><span class="line"># <span class="keyword">SET</span> character_set_client <span class="operator">=</span> utf8mb4;</span><br><span class="line"># <span class="keyword">SET</span> character_set_connection <span class="operator">=</span> utf8mb4;</span><br><span class="line"># <span class="keyword">SET</span> character_set_results <span class="operator">=</span> utf8mb4;</span><br><span class="line"></span><br><span class="line"><span class="keyword">SET</span> NAMES utf8mb4;</span><br></pre></td></tr></table></figure>

<figure class="highlight sql"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">CREATE</span> DATABASE IF <span class="keyword">NOT</span> <span class="keyword">EXISTS</span> dw <span class="keyword">DEFAULT</span> <span class="keyword">CHARACTER SET</span> utf8mb4 <span class="keyword">COLLATE</span> utf8mb4_general_ci;</span><br><span class="line"># 创建dw数据库并设置字符集为utf8mb4且不区分大小写。</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">设置不区分大小写可以提升查询性能</span><br><span class="line">但是对于一些字段比如用户名,验证码,token等必须区分大小写的可以在建表阶段单独指定</span><br></pre></td></tr></table></figure>

<figure class="highlight sql"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">CREATE TABLE</span> <span class="string">&#x27;user&#x27;</span> (</span><br><span class="line">	id <span class="type">INT</span> <span class="keyword">PRIMARY KEY</span> AUTO_INCREMENT,</span><br><span class="line">    username <span class="type">VARCHAR</span>(<span class="number">20</span>) <span class="keyword">NOT NULL</span> <span class="keyword">COLLATE</span> utf8mb4_gengeral_cs, <span class="comment">-- 单独指定区分大小写。</span></span><br><span class="line">    nickename <span class="type">VARCHAR</span>(<span class="number">20</span>) <span class="keyword">NOT NULL</span>, <span class="comment">-- 沿用库默认，不区分大小写</span></span><br><span class="line">);</span><br></pre></td></tr></table></figure>

<figure class="highlight sql"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">GRANT</span> <span class="keyword">ALL</span> PRIVILEGES <span class="keyword">ON</span> dw.<span class="operator">*</span> <span class="keyword">TO</span> <span class="string">&#x27;ljx&#x27;</span>@<span class="string">&#x27;%&#x27;</span>;</span><br><span class="line">FLUSH PRIVILEGES;</span><br><span class="line"><span class="comment">-- 授予任何方式连接的ljx用户操作dw数据库的所有权限</span></span><br><span class="line"><span class="comment">-- 执行完后必须刷新权限</span></span><br></pre></td></tr></table></figure>

<figure class="highlight sql"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">USE dw; <span class="comment">-- 使用dw数据库</span></span><br></pre></td></tr></table></figure>
