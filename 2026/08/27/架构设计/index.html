    <h1 class="p-name article-title" itemprop="headline name">
      架构设计
    </h1>
  

      </header>
    
    <div class="e-content article-entry" itemprop="articleBody">
      
        <h5 id="最外层的conf"><a href="#最外层的conf" class="headerlink" title="最外层的conf"></a>最外层的conf</h5><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line">app_config:所有的服务</span><br><span class="line"></span><br><span class="line">包括logging, mysqldb, es, qdrant,llm, embedding</span><br></pre></td></tr></table></figure>

<figure class="highlight yaml"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line"><span class="attr">llm:</span></span><br><span class="line">	<span class="attr">base_url:</span> <span class="string">https://../v1</span></span><br><span class="line">	<span class="attr">model:</span> <span class="string">deepseek-flash-v4</span></span><br><span class="line">	<span class="attr">api_key:</span> <span class="string">$&#123;oc.env:API_KEY&#125;</span></span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><span class="line">$&#123;oc.env:API_KEY&#125;是OmegaConf(简称oc)的环境变量插值语法:</span><br><span class="line">	oc: OmegaConf库的内置环境变量解析器前缀</span><br><span class="line">	env: 代表读取系统的环境变量</span><br><span class="line">	API_KEY: 环境变量名</span><br><span class="line"></span><br><span class="line">运行程序时,OmegaConf会自动读取名为API_KEY的环境变量,把值替换到这个位置等效于:</span><br><span class="line">API_KEY: xxxxx</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line">流程:</span><br><span class="line"></span><br><span class="line">.env文件定义变量--.yaml文件配置$&#123;oc.env:API_KEY&#125;--laod_dotenv()加载到系统环境--OmegaConf解析$&#123;oc.env:API_KEY&#125;</span><br></pre></td></tr></table></figure>

<figure class="highlight yaml"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line"><span class="attr">api_key:</span> <span class="string">$&#123;oc.env:API_KEY,</span> <span class="string">&#x27;default_value&#x27;</span><span class="string">&#125;</span></span><br><span class="line"><span class="comment"># 带默认值,如果环境变量不存在则使用默认字符串</span></span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">原生的yaml不具备$&#123;&#125;的能力,纯yaml的$&#123;xxx&#125;只是普通字符串解析,只有基于OmegaConf加载配置文件时,$&#123;oc.env:API_KEY&#125;才会被解析</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">1.如果忘记调用load_dotenv(),环境变量不会自动加载,会导致变量为空或者抛出异常</span><br><span class="line">2..env格式中不能有空格,等号两侧的空格会直接读入值中.</span><br></pre></td></tr></table></figure>
